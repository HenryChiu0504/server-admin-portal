services:
  bot:
    # GitHub Actions 建好的 image；NAS 不需要 git，也不用自己 build。
    # 自己在本機 build 請用：docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ${IMAGE:-ghcr.io/henrychiu0504/stock-gift-bot:latest}
    container_name: stock-gift-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data          # bot.db 與 manual_gifts.csv 放這裡
    ports:
      - "13999:13999"

  # LINE webhook 必須是公開的 HTTPS 網址。用 Cloudflare Tunnel 不用開路由器 port。
  # 在 Cloudflare Zero Trust 建立 Tunnel，Public Hostname 的 Path 填 callback、Service 填 http://bot:13999
  # （只開放 /callback，後台 /admin 就只能在家裡區網用 http://NAS:13999/admin 連），
  # 再把 token 填到 .env 的 CLOUDFLARE_TUNNEL_TOKEN，並在 .env 設 COMPOSE_PROFILES=tunnel 啟用。
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - bot
