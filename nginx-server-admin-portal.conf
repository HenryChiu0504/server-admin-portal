map $http_upgrade $portal_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8088;
    server_name _;

    client_max_body_size 2m;

    # File manager: 8 MB upload chunks, and stream large downloads/zips
    # straight through instead of buffering them to disk in nginx.
    location /api/files/ {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Web terminal (WebSocket)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $portal_connection_upgrade;
        proxy_read_timeout 1h;
    }
}
