name: stock-gift-bot

# Push to any branch: run tests, then build the Docker image and publish it to
#   ghcr.io/<owner>/stock-gift-bot:<branch>   (and :latest for the default branch)
# The NAS pulls that image (stock-gift-bot/update.sh). Pull requests only run tests.
on:
  push:
    paths: ["stock-gift-bot/**", ".github/workflows/stock-gift-bot.yml"]
  pull_request:
    paths: ["stock-gift-bot/**", ".github/workflows/stock-gift-bot.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-gift-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3      # arm64 build for ARM-based NAS
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: owner   # image names must be lowercase
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/stock-gift-bot
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: stock-gift-bot
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}@${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
